name: Build Windows x64

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate schedule data
        run: python tools/generate_data.py --check
      - name: Build and test
        shell: pwsh
        run: ./tools/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: gw2-nexus-timer-windows-x64
          path: dist/gw2_nexus_timer.dll
